<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>אליפות החשבון של מיקה</title>
  <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --card-bg: #ffffff;
      --text-main: #2d3748;
      --primary: #6c5ce7;
      --primary-hover: #5b4bc4;
      --accent: #ff7675;
      --success: #00b894;
      --shadow: 0 15px 35px rgba(0,0,0,0.1);
    }

    * {
      box-sizing: border-box;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Varela Round', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      margin: 0;
      padding: 15px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-main);
    }

    .game-container {
      background: var(--card-bg);
      border-radius: 28px;
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 480px;
      padding: 24px;
      text-align: center;
      position: relative;
      overflow: hidden;
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      background: #f8f9fa;
      padding: 12px 18px;
      border-radius: 20px;
      font-size: 1rem;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
    }

    .score-badge { color: #d63031; font-weight: bold; }
    .level-badge { color: #0984e3; font-weight: bold; }
    .streak-badge { color: #00b894; font-weight: bold; }

    .question-card {
      background: linear-gradient(145deg, #f3f4f6, #ffffff);
      border: 2px solid #e2e8f0;
      border-radius: 22px;
      padding: 22px 15px;
      margin-bottom: 20px;
      min-height: 130px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.03);
    }

    .question-title {
      font-size: 1.1rem;
      color: #718096;
      margin-bottom: 8px;
    }

    .question-text {
      font-size: 1.9rem;
      font-weight: bold;
      color: #1a202c;
    }

    .answer-display {
      min-height: 56px;
      background: #f1f5f9;
      border: 2px dashed #cbd5e1;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: bold;
      margin-bottom: 18px;
      padding: 6px 12px;
      color: #334155;
      flex-wrap: wrap;
      gap: 8px;
    }

    .word-chip {
      background: var(--primary);
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 1.1rem;
      box-shadow: 0 4px 10px rgba(108, 92, 231, 0.3);
      cursor: pointer;
      transition: transform 0.1s;
    }
    .word-chip:active { transform: scale(0.92); }

    .words-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 18px;
    }

    .btn-word {
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      padding: 10px 16px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #4a5568;
      box-shadow: 0 4px 6px rgba(0,0,0,0.02);
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-word:active {
      transform: scale(0.93);
      background: #edf2f7;
      border-color: var(--primary);
    }

    .numpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .btn-num {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      font-size: 1.5rem;
      font-weight: bold;
      padding: 14px 0;
      color: #334155;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.02);
      transition: all 0.1s;
    }

    .btn-num:active {
      background: #e2e8f0;
      transform: scale(0.95);
    }

    .btn-action {
      background: #ff7675;
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 1.1rem;
      font-weight: bold;
      padding: 12px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(255, 118, 117, 0.3);
    }

    .btn-submit {
      background: var(--success);
      color: white;
      border: none;
      border-radius: 18px;
      font-size: 1.3rem;
      font-weight: bold;
      width: 100%;
      padding: 14px;
      box-shadow: 0 6px 20px rgba(0, 184, 148, 0.4);
      cursor: pointer;
      transition: transform 0.1s;
    }

    .btn-submit:active { transform: scale(0.97); }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 18px;
    }

    .btn-option {
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      padding: 14px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #2d3748;
      cursor: pointer;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.02);
      transition: all 0.2s;
    }

    .btn-option:active {
      background: #edf2f7;
      border-color: var(--primary);
      transform: scale(0.98);
    }

    .feedback {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(255, 255, 255, 0.96);
      z-index: 10;
      display: none;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .feedback-icon { font-size: 5.5rem; margin-bottom: 10px; }
    .feedback-text { font-size: 1.8rem; font-weight: bold; }
  </style>
</head>
<body>

<div class="game-container">
  <div class="header">
    <span class="score-badge">⭐ <span id="score">0</span> נקודות</span>
    <span class="level-badge">שלב <span id="level">1</span></span>
    <span class="streak-badge">🔥 <span id="streak">0</span> ברצף</span>
  </div>

  <div class="question-card">
    <div class="question-title" id="q-title">טוען שאלה...</div>
    <div class="question-text" id="q-text">---</div>
  </div>

  <div id="controls-area"></div>

  <button class="btn-submit" id="submit-btn" onclick="checkAnswer()">בדיקה 👍</button>

  <div class="feedback" id="feedback">
    <div class="feedback-icon" id="fb-icon">🎉</div>
    <div class="feedback-text" id="fb-text">כל הכבוד!</div>
  </div>
</div>

<script>
  let currentScore = 0;
  let currentLevel = 1;
  let streak = 0;
  let currentQuestion = null;
  let userWordInput = [];
  let userNumInput = "";

  const unitsWords = ["", "אחת", "שתים", "שלוש", "ארבע", "חמש", "שש", "שבע", "שמונה", "תשע"];
  const tensWords = ["", "עשר", "עשרים", "שלושים", "ארבעים", "חמישים", "שישים", "שבעים", "שמונים", "תשעים"];
  const hundredsWords = ["", "מאה", "מאתיים", "שלוש מאות", "ארבע מאות", "חמש מאות", "שש מאות", "שבע מאות", "שמונה מאות", "תשע מאות"];

  function numberToWords(num) {
    if (num === 0) return "אפס";
    let h = Math.floor(num / 100);
    let rem = num % 100;
    let t = Math.floor(rem / 10);
    let u = rem % 10;

    let parts = [];
    if (h > 0) parts.push(hundredsWords[h]);
    
    if (t === 1 && u > 0) {
      const teens = ["עשר", "אחד עשר", "שתים עשרה", "שלוש עשרה", "ארבע עשרה", "חמש עשרה", "שש עשרה", "שבע עשרה", "שמונה עשרה", "תשע עשרה"];
      parts.push(teens[u]);
    } else {
      if (t > 0) parts.push(tensWords[t]);
      if (u > 0) {
        let uWord = unitsWords[u];
        if (parts.length > 0) uWord = "ו" + uWord;
        parts.push(uWord);
      }
    }
    return parts.join(" ");
  }

  function generateQuestion() {
    userWordInput = [];
    userNumInput = "";
    
    const types = ['words_to_num', 'num_to_words', 'prev_next', 'sequence', 'round_tens'];
    const type = types[Math.floor(Math.random() * types.length)];
    const num = Math.floor(Math.random() * 899) + 101;

    if (type === 'num_to_words') {
      const correctWords = numberToWords(num);
      currentQuestion = { type: 'word_builder', title: 'כתבו את המספר במילים:', text: num, answer: correctWords };
    } 
    else if (type === 'words_to_num') {
      const wordsText = numberToWords(num);
      currentQuestion = { type: 'numpad', title: 'איזה מספר זה במילים?', text: wordsText, answer: num.toString() };
    }
    else if (type === 'prev_next') {
      const isPrev = Math.random() > 0.5;
      const targetNum = isPrev ? num - 1 : num + 1;
      currentQuestion = { type: 'numpad', title: isPrev ? `מה המספר הקודם למספר:` : `מה המספר העוקב (הבא) למספר:`, text: num, answer: targetNum.toString() };
    }
    else if (type === 'round_tens') {
      const lower = Math.floor(num / 10) * 10;
      const upper = lower + 10;
      currentQuestion = {
        type: 'choice',
        title: 'בין אילו עשרות שלמות נמצא המספר?',
        text: num,
        options: [`${lower} ל- ${upper}`, `${lower - 10} ל- ${lower}`, `${upper} ל- ${upper + 10}`],
        answer: `${lower} ל- ${upper}`
      };
    }
    else if (type === 'sequence') {
      const step = [1, 10, 100][Math.floor(Math.random() * 3)];
      const seq = [num, num + step, num + step * 2];
      const ans = num + step * 3;
      currentQuestion = { type: 'numpad', title: `מה המספר הבא בסדרה? (קפיצות של ${step})`, text: `${seq.join(', ')}, ___`, answer: ans.toString() };
    }

    renderQuestion();
  }

  function renderQuestion() {
    document.getElementById('q-title').innerText = currentQuestion.title;
    document.getElementById('q-text').innerText = currentQuestion.text;

    const area = document.getElementById('controls-area');
    const submitBtn = document.getElementById('submit-btn');
    area.innerHTML = "";

    if (currentQuestion.type === 'word_builder') {
      submitBtn.style.display = "block";
      const display = document.createElement('div');
      display.className = 'answer-display';
      display.id = 'word-display';
      area.appendChild(display);

      const wordsGrid = document.createElement('div');
      wordsGrid.className = 'words-grid';

      let pool = [
        "מאה", "מאתיים", "שלוש מאות", "ארבע מאות", "חמש מאות", "שש מאות", "שבע מאות", "שמונה מאות", "תשע מאות",
        "עשרים", "שלושים", "ארבעים", "חמישים", "שישים", "שבעים", "שמונים", "תשעים",
        "אחת", "שתים", "שלוש", "ארבע", "חמש", "שש", "שבע", "שמונה", "תשע",
        "ואחת", "ושתים", "ושלוש", "וארבע", "וחמש", "ושש", "ושבע", "ושמונה", "ותשע"
      ];

      const correctParts = currentQuestion.answer.split(" ");
      let options = Array.from(new Set([...correctParts, ...pool.sort(() => 0.5 - Math.random()).slice(0, 6)]));
      options.sort(() => 0.5 - Math.random());

      options.forEach(w => {
        const btn = document.createElement('button');
        btn.className = 'btn-word';
        btn.innerText = w;
        btn.onclick = () => { userWordInput.push(w); updateWordDisplay(); };
        wordsGrid.appendChild(btn);
      });
      area.appendChild(wordsGrid);
    } 
    else if (currentQuestion.type === 'numpad') {
      submitBtn.style.display = "block";
      const display = document.createElement('div');
      display.className = 'answer-display';
      display.id = 'num-display';
      area.appendChild(display);

      const numpad = document.createElement('div');
      numpad.className = 'numpad';

      for (let i = 1; i <= 9; i++) {
        const btn = document.createElement('button');
        btn.className = 'btn-num';
        btn.innerText = i;
        btn.onclick = () => { userNumInput += i; updateNumDisplay(); };
        numpad.appendChild(btn);
      }

      const clearBtn = document.createElement('button');
      clearBtn.className = 'btn-action';
      clearBtn.innerText = 'מחיקה ⌫';
      clearBtn.onclick = () => { userNumInput = userNumInput.slice(0, -1); updateNumDisplay(); };
      numpad.appendChild(clearBtn);

      const zeroBtn = document.createElement('button');
      zeroBtn.className = 'btn-num';
      zeroBtn.innerText = '0';
      zeroBtn.onclick = () => { userNumInput += '0'; updateNumDisplay(); };
      numpad.appendChild(numpad.appendChild ? zeroBtn : zeroBtn); // safe append
      numpad.appendChild(zeroBtn);

      area.appendChild(numpad);
    }
    else if (currentQuestion.type === 'choice') {
      submitBtn.style.display = "none";
      const optionsGrid = document.createElement('div');
      optionsGrid.className = 'options-grid';

      let shuffled = [...currentQuestion.options].sort(() => 0.5 - Math.random());
      shuffled.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerText = opt;
        btn.onclick = () => checkChoiceAnswer(opt);
        optionsGrid.appendChild(btn);
      });
      area.appendChild(optionsGrid);
    }
  }

  function updateWordDisplay() {
    const disp = document.getElementById('word-display');
    disp.innerHTML = "";
    userWordInput.forEach((w, index) => {
      const chip = document.createElement('span');
      chip.className = 'word-chip';
      chip.innerText = w;
      chip.onclick = () => { userWordInput.splice(index, 1); updateWordDisplay(); };
      disp.appendChild(chip);
    });
  }

  function updateNumDisplay() {
    document.getElementById('num-display').innerText = userNumInput;
  }

  function checkAnswer() {
    let userAns = "";
    if (currentQuestion.type === 'word_builder') userAns = userWordInput.join(" ");
    else if (currentQuestion.type === 'numpad') userAns = userNumInput;
    validate(userAns === currentQuestion.answer);
  }

  function checkChoiceAnswer(selected) {
    validate(selected === currentQuestion.answer);
  }

  function validate(isCorrect) {
    const fb = document.getElementById('feedback');
    const fbIcon = document.getElementById('fb-icon');
    const fbText = document.getElementById('fb-text');

    fb.style.display = 'flex';

    if (isCorrect) {
      fbIcon.innerText = '🎉';
      fbText.innerText = 'נכון מאוד! אלופה!';
      fbText.style.color = '#00b894';
      currentScore += 10;
      streak++;
      if (streak % 5 === 0) currentLevel++;
    } else {
      fbIcon.innerText = '💡';
      fbText.innerText = `לא נורא! התשובה: ${currentQuestion.answer}`;
      fbText.style.color = '#ff7675';
      streak = 0;
    }

    document.getElementById('score').innerText = currentScore;
    document.getElementById('level').innerText = currentLevel;
    document.getElementById('streak').innerText = streak;

    setTimeout(() => {
      fb.style.display = 'none';
      generateQuestion();
    }, 2000);
  }

  generateQuestion();
</script>
</body>
</html>
